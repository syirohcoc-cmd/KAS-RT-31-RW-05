<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kas RT</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}:root{--g:#16a34a}
body{margin:0;font:15px system-ui,sans-serif;background:#f3f4f6;color:#1f2937}
header{background:var(--g);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;height:56px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e7eb;display:flex;overflow-x:auto;z-index:5}
nav a{flex:1;min-width:64px;text-align:center;padding:8px 4px;font-size:11px;color:#6b7280;cursor:pointer}
nav a b{display:block;font-size:20px}nav a.on{color:var(--g);font-weight:600}
main{padding:14px 14px 90px;max-width:960px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 2px #0001}
.card small{color:#6b7280}.card h3{margin:4px 0 0;font-size:18px}
.hero{background:linear-gradient(135deg,#16a34a,#166534);color:#fff;grid-column:1/-1}.hero small{color:#dcfce7}.hero h3{font-size:28px}
.b{background:var(--g);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer}
.b.s{background:#e5e7eb;color:#374151}.b.r{background:#dc2626}.b.m{padding:5px 9px;font-size:12px}
input,select{width:100%;padding:9px;border:1px solid #d1d5db;border-radius:8px;font:inherit;margin:4px 0 10px;background:#fff}
label{font-size:13px;color:#4b5563;display:block}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #f3f4f6}
.tag{padding:2px 8px;border-radius:99px;font-size:11px;background:#e5e7eb}
.Lunas{background:#dcfce7;color:#166534}.Sebagian{background:#fef3c7;color:#92400e}.Belum{background:#fee2e2;color:#991b1b}
.ov{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.box{background:#fff;width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}h2,h3{margin:0 0 8px}
#t{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:8px;z-index:30;display:none}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px;border-bottom:1px solid #eee;text-align:left}
.in{color:#16a34a}.out{color:#dc2626}.mt{margin-top:10px}.lg{max-width:340px;margin:12vh auto;padding:0 16px}
@media(min-width:800px){nav{top:56px;bottom:0;right:auto;width:170px;flex-direction:column}
nav a{flex:none;text-align:left;font-size:14px;padding:12px 16px}nav a b{display:inline;font-size:16px;margin-right:8px}
main{margin-left:190px}.cards{grid-template-columns:repeat(3,1fr)}.ov{align-items:center}.box{border-radius:16px}}
@media print{header,nav,.np{display:none!important}main{margin:0;padding:0}}
</style></head><body>
<div id="app"></div><div id="m"></div><div id="t"></div>
<script>
const $=s=>document.querySelector(s),rp=n=>'Rp '+Number(n||0).toLocaleString('id-ID'),
esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
pad=n=>String(n).padStart(2,'0'),ym=d=>d.getFullYear()+'-'+pad(d.getMonth()+1),ymd=d=>ym(d)+'-'+pad(d.getDate()),
KI=['Iuran Bulanan','Jimpitan','Sumbangan','Lainnya'],KO=['Kebersihan','Keamanan','Sosial','Perbaikan','Kegiatan','Lainnya'],
opts=(a,s)=>a.map(k=>`<option ${k==s?'selected':''}>${k}</option>`).join(''),
tot=a=>a.reduce((r,t)=>(t.jenis=='masuk'?r.m+=+t.nominal:r.k+=+t.nominal,r),{m:0,k:0}),
isA=()=>me.role=='admin',nm=id=>(S.warga.find(w=>w.id==id)||{}).nama||'-';
let sb,cfg,me,page='dash',chart,S={warga:[],trx:[],users:[],set:{nama_rt:'RT 01',iuran_nominal:20000,mulai:ym(new Date())}};
function toast(m){const t=$('#t');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
function modal(h){$('#m').innerHTML=h?`<div class=ov onclick="if(event.target==this)modal()"><div class=box>${h}</div></div>`:''}
function months(a,b){const r=[];let[y,m]=a.split('-').map(Number);while(y+'-'+pad(m)<=b){r.push(y+'-'+pad(m));if(++m>12){m=1;y++}}return r}
async function all(q){let r=[],i=0,d;do{d=(await q().range(i,i+999)).data||[];r=r.concat(d);i+=1000}while(d.length==1000);return r}

/* ---------- koneksi & login ---------- */
function boot(){const c=localStorage.kascfg;if(!c){$('#app').innerHTML=`<div class=lg><h2>🔧 Hubungkan Supabase</h2><p>Isi sekali saja (lihat panduan).</p><label>Project URL<input id=cu placeholder="https://xxxx.supabase.co"></label><label>Anon public key<input id=ck></label><button class=b onclick="saveCfg()">Simpan</button></div>`;return}
cfg=JSON.parse(c);sb=supabase.createClient(cfg.url,cfg.key);sb.auth.getSession().then(({data})=>data.session?start():loginUI())}
function saveCfg(){const url=$('#cu').value.trim(),key=$('#ck').value.trim();if(!url||!key)return toast('Lengkapi data');localStorage.kascfg=JSON.stringify({url,key});boot()}
function loginUI(){$('#app').innerHTML=`<div class=lg><h2>💰 Kas RT</h2><label>Username<input id=u autocapitalize=none></label><label>Password<input id=p type=password></label><button class=b style="width:100%" onclick="auth(0)">Masuk</button><p style="text-align:center"><small>Pertama kali? Akun yang pertama didaftarkan otomatis menjadi Admin.</small><br><button class="b s m" onclick="auth(1)">Daftar akun</button> <button class="b s m" onclick="localStorage.removeItem('kascfg');boot()">Ubah koneksi</button></p></div>`}
async function auth(reg){const u=$('#u').value.trim().toLowerCase(),p=$('#p').value;if(!/^[a-z0-9._-]+$/.test(u)||p.length<6)return toast('Username huruf/angka tanpa spasi; password min. 6 karakter');
const em=u+'@kasrt.app',r=reg?await sb.auth.signUp({email:em,password:p,options:{data:{username:u}}}):await sb.auth.signInWithPassword({email:em,password:p});
if(r.error)return toast(r.error.message.includes('Invalid login')?'Username atau password salah':r.error.message);
if(!r.data.session)return toast('Di Supabase, matikan "Confirm email" (lihat panduan)');start()}
async function out(){await sb.auth.signOut();location.reload()}
async function start(){const{data:{user}}=await sb.auth.getUser();const{data}=await sb.from('profiles').select('*').eq('id',user.id).single();
if(!data)return toast('Profil tidak ditemukan. Pastikan schema.sql sudah dijalankan.');me=data;await load();shell();render();
if(me.role=='warga'&&!me.warga_id)toast('Akun belum ditautkan ke data warga. Hubungi bendahara.')}
async function load(){const[w,t,s,p]=await Promise.all([all(()=>sb.from('warga').select('*').order('no_rumah')),all(()=>sb.from('transaksi').select('*').order('tanggal',{ascending:false})),sb.from('settings').select('*').eq('id',1).single(),sb.from('profiles').select('*')]);
S.warga=w;S.trx=t;if(s.data)S.set=s.data;S.users=p.data||[]}
setInterval(async()=>{if(me&&!$('#m').innerHTML&&page!='set'){await load();render()}},30000);

/* ---------- kerangka ---------- */
function shell(){const N={dash:['🏠','Beranda'],masuk:['⬇️','Kas Masuk'],keluar:['⬆️','Kas Keluar'],iuran:['🧾','Iuran'],warga:['👥','Warga'],laporan:['📊','Laporan'],set:['⚙️','Atur']};
const k=isA()?Object.keys(N):me.role=='ketua'?['dash','masuk','keluar','iuran','warga','laporan']:['dash','iuran','laporan'];
$('#app').innerHTML=`<header><b>💰 Kas ${esc(S.set.nama_rt)}</b><span><small>${esc(me.username)} · ${me.role}</small> <button class="b s m" onclick="out()">Keluar</button></span></header><nav>${k.map(x=>`<a id=n_${x} onclick="go('${x}')"><b>${N[x][0]}</b>${N[x][1]}</a>`).join('')}</nav><main id=c></main>`}
function go(p){page=p;render()}
function render(){document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.id=='n_'+page));$('#c').innerHTML=pages[page]();if($('#ch'))drawChart()}

/* ---------- iuran (otomatis) ---------- */
function irows(){const cur=ym(new Date()),ms=months(S.set.mulai,cur),nom=+S.set.iuran_nominal;
return S.warga.filter(w=>w.aktif).map(w=>{const p={};S.trx.filter(t=>t.jenis=='masuk'&&t.kategori=='Iuran Bulanan'&&t.warga_id==w.id).forEach(t=>p[t.bulan]=(p[t.bulan]||0)+ +t.nominal);
let tg=0;const det=ms.map(m=>{const pd=p[m]||0;tg+=Math.max(0,nom-pd);return{m,pd,st:pd>=nom?'Lunas':pd>0?'Sebagian':'Belum'}});
const c=det[det.length-1];return{w,det,tg,cur:c?c.st:'Lunas',pd:c?c.pd:0}})}

/* ---------- halaman ---------- */
const pages={dash,masuk:()=>trxPage('masuk'),keluar:()=>trxPage('keluar'),iuran,warga:wargaPage,laporan:lap,set:setPage};
function dash(){const t=tot(S.trx),ir=irows(),ok=ir.filter(r=>r.cur=='Lunas').length;
return `<div class=cards><div class="card hero"><small>Saldo Kas Saat Ini</small><h3>${rp(t.m-t.k)}</h3></div>
<div class=card><small>Total Pemasukan</small><h3 class=in>${rp(t.m)}</h3></div><div class=card><small>Total Pengeluaran</small><h3 class=out>${rp(t.k)}</h3></div>
${me.role=='warga'?'':`<div class=card><small>Jumlah Warga</small><h3>${S.warga.filter(w=>w.aktif).length}</h3></div><div class=card><small>Sudah Bayar Iuran (bulan ini)</small><h3 class=in>${ok}</h3></div><div class=card><small>Belum Bayar</small><h3 class=out>${ir.length-ok}</h3></div>`}</div>
<div class="card mt"><b>Pemasukan vs Pengeluaran (6 bulan)</b><canvas id=ch height=170></canvas></div>${me.role=='warga'?'<div class=mt>'+iuran()+'</div>':''}`}
function drawChart(){const d=new Date(),ls=[];for(let i=5;i>=0;i--)ls.push(ym(new Date(d.getFullYear(),d.getMonth()-i,1)));
const f=j=>ls.map(m=>S.trx.filter(t=>t.jenis==j&&t.tanggal.startsWith(m)).reduce((a,t)=>a+ +t.nominal,0));
chart&&chart.destroy();chart=new Chart($('#ch'),{type:'bar',data:{labels:ls,datasets:[{label:'Masuk',data:f('masuk'),backgroundColor:'#16a34a'},{label:'Keluar',data:f('keluar'),backgroundColor:'#9ca3af'}]},options:{responsive:true}})}

function wargaPage(){return `<div class=hd><h2>Data Warga</h2>${isA()?`<button class=b onclick="wForm()">+ Tambah</button>`:''}</div><div class=card>${S.warga.map(w=>`<div class=row><div><b>${esc(w.no_rumah)} · ${esc(w.nama)}</b> <span class=tag>${w.aktif?'Aktif':'Tidak aktif'}</span><br><small>${esc(w.alamat)} ${w.wa?`· <a href="https://wa.me/${String(w.wa).replace(/\D/g,'').replace(/^0/,'62')}" target=_blank>${esc(w.wa)}</a>`:''}</small></div>${isA()?`<span><button class="b s m" onclick="wForm('${w.id}')">Edit</button> <button class="b r m" onclick="wDel('${w.id}')">Hapus</button></span>`:''}</div>`).join('')||'<p>Belum ada warga.</p>'}</div>`}
function wForm(id){const w=S.warga.find(x=>x.id==id)||{aktif:true};modal(`<h3>${id?'Edit':'Tambah'} Warga</h3><form onsubmit="wSave(event,'${id||''}')"><label>Nomor rumah<input name=no_rumah value="${esc(w.no_rumah)}" required></label><label>Nama kepala keluarga<input name=nama value="${esc(w.nama)}" required></label><label>Alamat<input name=alamat value="${esc(w.alamat)}"></label><label>Nomor WhatsApp<input name=wa value="${esc(w.wa)}" inputmode=tel></label><label>Status<select name=aktif><option value=1 ${w.aktif?'selected':''}>Aktif</option><option value=0 ${w.aktif?'':'selected'}>Tidak aktif</option></select></label><button class=b>Simpan</button> <button type=button class="b s" onclick="modal()">Batal</button></form>`)}
async function wSave(e,id){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));f.aktif=f.aktif=='1';
const{error}=await(id?sb.from('warga').update(f).eq('id',id):sb.from('warga').insert(f));if(error)return toast(error.message);modal();await load();render();toast('Tersimpan')}
async function wDel(id){if(!confirm('Hapus warga ini? Riwayat transaksi tetap tersimpan.'))return;const{error}=await sb.from('warga').delete().eq('id',id);if(error)return toast(error.message);await load();render()}

function trxPage(j){const l=S.trx.filter(t=>t.jenis==j).slice(0,150),c=j=='masuk'?'in':'out';
return `<div class=hd><h2>Kas ${j=='masuk'?'Masuk':'Keluar'}</h2>${isA()?`<button class=b onclick="tForm('${j}')">+ Tambah</button>`:''}</div><div class=card>${l.map(t=>`<div class=row><div><b>${esc(t.kategori)}</b> <small>${t.tanggal}${t.bulan?' · iuran '+t.bulan:''}</small><br><small>${esc(t.pihak||'')} ${esc(t.keterangan||'')} ${t.bukti_url?`<a href="${esc(t.bukti_url)}" target=_blank>📎 bukti</a>`:''}</small></div><div style="text-align:right"><b class=${c}>${rp(t.nominal)}</b>${isA()?`<br><button class="b s m" onclick="tForm('${j}','${t.id}')">Edit</button> <button class="b r m" onclick="tDel('${t.id}')">Hapus</button>`:''}</div></div>`).join('')||'<p>Belum ada transaksi.</p>'}</div>`}
function tForm(j,id,pre){const t=S.trx.find(x=>x.id==id)||pre||{},ks=j=='masuk'?KI:KO,kat=t.kategori||ks[0];
modal(`<h3>${id?'Edit':'Tambah'} Kas ${j}</h3><form onsubmit="tSave(event,'${j}','${id||''}')"><label>Tanggal<input type=date name=tanggal value="${t.tanggal||ymd(new Date())}" required></label>
<label>Kategori<select name=kategori onchange="$('#bl').style.display=this.value=='Iuran Bulanan'&&'${j}'=='masuk'?'':'none'">${opts(ks,kat)}</select></label>
${j=='masuk'?`<label>Warga<select name=warga_id><option value="">— Sumber lain —</option>${S.warga.map(w=>`<option value=${w.id} ${w.id==t.warga_id?'selected':''}>${esc(w.no_rumah)} · ${esc(w.nama)}</option>`).join('')}</select></label>`:''}
<label>${j=='masuk'?'Sumber (jika bukan warga)':'Penerima uang'}<input name=pihak value="${esc(t.pihak)}"></label>
<div id=bl style="display:${kat=='Iuran Bulanan'&&j=='masuk'?'':'none'}"><label>Iuran untuk bulan<input type=month name=bulan value="${t.bulan||ym(new Date())}"></label></div>
<label>Nominal (Rp)<input type=number name=nominal min=1 value="${t.nominal||''}" required inputmode=numeric></label><label>Keterangan<input name=keterangan value="${esc(t.keterangan)}"></label>
<label>Upload bukti (foto/PDF)<input type=file name=bukti accept="image/*,.pdf"></label><button class=b>Simpan</button> <button type=button class="b s" onclick="modal()">Batal</button></form>`)}
async function tSave(e,j,id){e.preventDefault();const f=new FormData(e.target),wid=f.get('warga_id')||null,iu=j=='masuk'&&f.get('kategori')=='Iuran Bulanan';
if(iu&&!wid)return toast('Iuran bulanan harus memilih warga');
const r={jenis:j,tanggal:f.get('tanggal'),kategori:f.get('kategori'),nominal:+f.get('nominal'),keterangan:f.get('keterangan'),warga_id:wid,pihak:wid?nm(wid):f.get('pihak'),bulan:iu?f.get('bulan'):null},file=f.get('bukti');
if(file&&file.size){const p=crypto.randomUUID()+'.'+(file.name.split('.').pop()||'bin'),u=await sb.storage.from('bukti').upload(p,file);if(u.error)return toast(u.error.message);r.bukti_url=sb.storage.from('bukti').getPublicUrl(p).data.publicUrl}
const{error}=await(id?sb.from('transaksi').update(r).eq('id',id):sb.from('transaksi').insert(r));if(error)return toast(error.message);modal();await load();render();toast('Tersimpan')}
async function tDel(id){if(!confirm('Hapus transaksi ini?'))return;const{error}=await sb.from('transaksi').delete().eq('id',id);if(error)return toast(error.message);await load();render()}

function iuran(){const ir=irows(),tg=ir.reduce((a,r)=>a+r.tg,0);
return `<div class=hd><h2>Iuran Warga</h2></div><div class="card" style="margin-bottom:10px"><small>Iuran per bulan: <b>${rp(S.set.iuran_nominal)}</b> · Total tunggakan: <b class=out>${rp(tg)}</b></small></div><div class=card>${ir.map(r=>`<div class=row><div><b>${esc(r.w.no_rumah)} · ${esc(r.w.nama)}</b> <span class="tag ${r.cur}">${r.cur=='Lunas'?'Lunas':r.cur}</span><br><small>Tunggakan: ${rp(r.tg)}</small></div><span><button class="b s m" onclick="hist('${r.w.id}')">Riwayat</button>${isA()?` <button class="b m" onclick="pay('${r.w.id}')">Bayar</button>`:''}</span></div>`).join('')||'<p>Belum ada data.</p>'}</div>`}
function hist(id){const r=irows().find(x=>x.w.id==id);modal(`<h3>Riwayat ${esc(r.w.nama)}</h3><table><tr><th>Bulan<th>Dibayar<th>Status</tr>${r.det.slice().reverse().map(d=>`<tr><td>${d.m}<td>${rp(d.pd)}<td><span class="tag ${d.st}">${d.st}</span></tr>`).join('')}</table><p>Total tunggakan: <b class=out>${rp(r.tg)}</b></p><button class="b s" onclick="modal()">Tutup</button>`)}
function pay(id){const r=irows().find(x=>x.w.id==id),o=r.det.find(d=>d.st!='Lunas')||r.det[r.det.length-1]||{m:ym(new Date()),pd:0};
tForm('masuk',null,{kategori:'Iuran Bulanan',warga_id:id,bulan:o.m,nominal:Math.max(0,+S.set.iuran_nominal-o.pd)||S.set.iuran_nominal})}

function lap(){const L=S.lap=S.lap||{t:'bulanan',v:ym(new Date())},v=L.v;
const rows=S.trx.filter(t=>L.t=='harian'?t.tanggal==v:t.tanggal.startsWith(v)).sort((a,b)=>a.tanggal<b.tanggal?-1:1),
st=L.t=='harian'?v:L.t=='bulanan'?v+'-01':v+'-01-01',aw=tot(S.trx.filter(t=>t.tanggal<st)),p=tot(rows);S.rows=rows;S.aw=aw.m-aw.k;
return `<div class="hd np"><h2>Laporan</h2><span><button class="b m" onclick="xl()">Excel</button> <button class="b m" onclick="print()">PDF</button></span></div>
<div class="np" style="display:flex;gap:8px"><select onchange="setLap(this.value)"><option value=harian ${L.t=='harian'?'selected':''}>Harian</option><option value=bulanan ${L.t=='bulanan'?'selected':''}>Bulanan</option><option value=tahunan ${L.t=='tahunan'?'selected':''}>Tahunan</option></select>
<input type=${L.t=='harian'?'date':L.t=='bulanan'?'month':'number'} value="${v}" onchange="S.lap.v=this.value;render()"></div>
<div class=card><h3>Laporan Kas ${esc(S.set.nama_rt)} — ${v}</h3><p>Saldo awal: <b>${rp(S.aw)}</b><br>Pemasukan: <b class=in>${rp(p.m)}</b><br>Pengeluaran: <b class=out>${rp(p.k)}</b><br>Saldo akhir: <b>${rp(S.aw+p.m-p.k)}</b></p>
<div style="overflow-x:auto"><table><tr><th>Tgl<th>Kategori<th>Pihak/Ket<th>Masuk<th>Keluar</tr>${rows.map(t=>`<tr><td>${t.tanggal}<td>${esc(t.kategori)}<td>${esc(t.pihak||'')} ${esc(t.keterangan||'')}<td class=in>${t.jenis=='masuk'?rp(t.nominal):''}<td class=out>${t.jenis=='keluar'?rp(t.nominal):''}</tr>`).join('')||'<tr><td colspan=5>Tidak ada transaksi.</tr>'}</table></div></div>`}
function setLap(t){const d=new Date();S.lap={t,v:t=='harian'?ymd(d):t=='bulanan'?ym(d):String(d.getFullYear())};render()}
function xl(){const L=S.lap,a=[['Laporan Kas '+S.set.nama_rt,L.t,L.v],['Saldo Awal',S.aw],[],['Tanggal','Jenis','Kategori','Pihak','Keterangan','Masuk','Keluar']];
S.rows.forEach(t=>a.push([t.tanggal,t.jenis,t.kategori,t.pihak||'',t.keterangan||'',t.jenis=='masuk'?+t.nominal:'',t.jenis=='keluar'?+t.nominal:'']));
const p=tot(S.rows);a.push([],['Total Masuk',p.m],['Total Keluar',p.k],['Saldo Akhir',S.aw+p.m-p.k]);
const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),'Laporan');XLSX.writeFile(wb,'laporan-kas-'+L.v+'.xlsx')}

function setPage(){const s=S.set;
return `<h2>Pengaturan</h2><div class=card><form onsubmit="setSave(event)"><label>Nama RT<input name=nama_rt value="${esc(s.nama_rt)}"></label><label>Nominal iuran per bulan (Rp)<input type=number name=iuran_nominal value="${s.iuran_nominal}"></label><label>Tagihan dimulai dari bulan<input type=month name=mulai value="${s.mulai}"></label><button class=b>Simpan</button></form></div>
<h3 class=mt>Pengguna</h3><div class=card>${S.users.map(u=>`<div class=row><b>${esc(u.username)}</b><span style="display:flex;gap:4px"><select onchange="upU('${u.id}','role',this.value)">${['admin','ketua','warga'].map(r=>`<option ${r==u.role?'selected':''}>${r}</option>`).join('')}</select><select onchange="upU('${u.id}','warga_id',this.value||null)"><option value="">(tanpa warga)</option>${S.warga.map(w=>`<option value=${w.id} ${w.id==u.warga_id?'selected':''}>${esc(w.no_rumah)} ${esc(w.nama)}</option>`).join('')}</select></span></div>`).join('')}
<hr><b>Buat akun baru</b><form onsubmit="addU(event)"><input name=u placeholder=username required><input name=p placeholder="password (min. 6)" required minlength=6><select name=r><option>warga</option><option>ketua</option><option>admin</option></select><select name=w><option value="">(tanpa warga)</option>${S.warga.map(w=>`<option value=${w.id}>${esc(w.no_rumah)} ${esc(w.nama)}</option>`).join('')}</select><button class=b>Buat akun</button></form></div>
<h3 class=mt>Backup &amp; Pemulihan</h3><div class=card><button class=b onclick="backup()">⬇️ Unduh Backup</button><p><label>Pulihkan dari file backup<input type=file accept=.json onchange="restore(event)"></label></p></div>`}
async function setSave(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));f.id=1;f.iuran_nominal=+f.iuran_nominal;const{error}=await sb.from('settings').upsert(f);if(error)return toast(error.message);await load();shell();render();toast('Tersimpan')}
async function upU(id,k,v){const{error}=await sb.from('profiles').update({[k]:v}).eq('id',id);toast(error?error.message:'Diperbarui');await load()}
async function addU(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),u=f.u.trim().toLowerCase();if(!/^[a-z0-9._-]+$/.test(u))return toast('Username: huruf/angka tanpa spasi');
const c2=supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:false,autoRefreshToken:false}}),{data,error}=await c2.auth.signUp({email:u+'@kasrt.app',password:f.p,options:{data:{username:u}}});
if(error)return toast(error.message);await sb.from('profiles').update({role:f.r,warga_id:f.w||null}).eq('id',data.user.id);await load();render();toast('Akun dibuat')}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({warga:S.warga,transaksi:S.trx,settings:S.set,at:new Date().toISOString()})],{type:'application/json'}));a.download='backup-kas-rt-'+ymd(new Date())+'.json';a.click()}
async function restore(e){const f=e.target.files[0];if(!f||!confirm('Pulihkan data dari backup? Data dengan ID sama akan ditimpa.'))return;
try{const d=JSON.parse(await f.text());for(const[t,r]of[['warga',d.warga||[]],['transaksi',d.transaksi||[]]])for(let i=0;i<r.length;i+=500){const{error}=await sb.from(t).upsert(r.slice(i,i+500));if(error)return toast(error.message)}
if(d.settings)await sb.from('settings').upsert(d.settings);await load();render();toast('Data berhasil dipulihkan')}catch(x){toast('File backup tidak valid')}}
boot();
</script></body></html>
